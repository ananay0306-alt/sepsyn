# Separation technology screening rules.
#
# Conditions may reference ONLY the flat fields of PropertyRecord.as_namespace().
# Comparisons against None evaluate to False -- a missing property never fires
# a rule.
#
# Edit this file to change the tool's judgment. No Python required.

- id: R-01
  name: ordinary distillation is viable
  priority: 10
  when: "min_alpha >= 1.05 and n_supercritical_at_feed == 0"
  verdict: feasible
  technologies: [distillation]
  because: >-
    all components are condensable at feed conditions and the smallest relative
    volatility is above 1.05, so ordinary distillation can achieve the split at
    a reasonable reflux
  cite: "Seader & Henley, Separation Process Principles, Ch.7"

- id: R-02
  name: relative volatility too low
  priority: 20
  when: "min_alpha < 1.05"
  verdict: infeasible
  technologies: [extractive_distillation, adsorption, membrane]
  because: >-
    below a relative volatility of about 1.05 the reflux ratio and stage count
    required make ordinary distillation uneconomic
  cite: "Douglas, Conceptual Design of Chemical Processes, Ch.7"

- id: R-03
  name: azeotrope blocks the split
  priority: 20
  when: "has_azeotrope"
  verdict: infeasible
  technologies: [pressure_swing, extractive_distillation, hybrid_adsorption]
  because: >-
    an azeotrope means relative volatility passes through 1.0, so no number of
    stages can cross it by ordinary distillation
  cite: "Seader & Henley, Separation Process Principles, Ch.11"

- id: R-04
  name: no condensable phase at feed
  priority: 5
  when: "n_supercritical_at_feed == n_components"
  verdict: infeasible
  technologies: [PSA, membrane, cryogenic_partial_condensation]
  because: >-
    every component is above its critical temperature at feed conditions, so no
    liquid phase exists at any pressure and there is nothing for a column to
    equilibrate
  cite: "Seader & Henley, Separation Process Principles, Ch.1"

- id: R-05
  name: some components supercritical
  priority: 8
  when: "n_supercritical_at_feed > 0 and n_supercritical_at_feed < n_components"
  verdict: caution
  technologies: [cryogenic_partial_condensation, flash]
  because: >-
    some components cannot be condensed at feed conditions; a partial
    condensation or cryogenic step is needed before any column
  cite: "Kohl & Nielsen, Gas Purification"
  requires:
    - >-
      vapour fraction remaining after cooling to the cooling-water limit, from
      a flash at (T_cooling_water, column P, feed composition). A small
      remaining vapour fraction means ordinary cooling does the work and a
      flash suffices; a fraction near 1 means cooling water accomplishes
      nothing and a cryogenic or compression route is needed
  limitations: >-
    the verdict stands on the supercritical count alone, but the choice between
    the two technologies offered does not: it is decided by that vapour
    fraction, which this rule has not computed

- id: R-06
  name: volatility gap wide enough for a single stage
  priority: 30
  when: "min_alpha > 10"
  verdict: feasible
  technologies: [flash]
  because: >-
    with a relative volatility above about 10 a single equilibrium stage may
    reach the required purity, making a full column unnecessary
  cite: "Douglas, Conceptual Design of Chemical Processes, Ch.7"

- id: R-07
  name: dilute volatile in a liquid
  priority: 40
  when: "feed_phase == 'liquid' and light_key_mole_fraction < 0.05"
  verdict: feasible
  technologies: [stripping]
  because: >-
    the volatile component is dilute in a liquid, so stripping with a gas is
    usually cheaper than boiling the whole stream
  cite: "Seader & Henley, Separation Process Principles, Ch.6"

- id: R-08
  name: dilute solute in a gas
  priority: 40
  when: "feed_phase == 'vapor' and heavy_key_mole_fraction < 0.05"
  verdict: feasible
  technologies: [absorption]
  because: >-
    the heavy component is dilute in a gas, so absorption into a solvent is
    usually cheaper than condensing the whole stream
  cite: "Seader & Henley, Separation Process Principles, Ch.6"

- id: R-09
  name: condenser needs refrigeration
  priority: 50
  when: "condensing_T_at_column_P < cooling_water_T"
  verdict: undetermined
  technologies: [distillation]
  because: >-
    the overhead cannot be condensed against cooling water at 40 C at the
    current column pressure, so refrigeration MAY be required -- but raising
    the column pressure raises the condensing temperature, and that has not
    been tried yet
  cite: "Towler & Sinnott, Chemical Engineering Design, Ch.3"
  requires:
    - >-
      condensing temperature recomputed at elevated column pressure: raise P
      and re-check against the cooling-water limit before accepting
      refrigeration. design.py already performs this search up to 30 bar
  limitations: >-
    above roughly 30 bar the compression needed to keep raising the pressure
    usually costs more than the refrigeration it avoids, so the search must be
    bounded rather than run to the pressure that happens to work

- id: R-10
  name: reboiler needs more than the available steam
  priority: 50
  when: "bottoms_T_at_column_P > steam_T - 5"
  verdict: caution
  technologies: [distillation]
  because: >-
    the bottoms boils at or above the available steam temperature, leaving no
    driving force in the reboiler; a hotter utility or a fired heater is needed,
    or the column pressure must come down
  cite: "Towler & Sinnott, Chemical Engineering Design, Ch.3"
  requires:
    - >-
      bottoms boiling temperature recomputed at a lower column pressure, since
      lowering pressure lowers it. Check the result against R-09 first, because
      the same move can push the overhead below cooling water
  limitations: >-
    the two pressure rules pull in opposite directions and the condenser side
    wins when they conflict, because refrigeration costs several times what a
    hotter utility does. Note also that condenser and reboiler pressures are not
    independent: they are linked by the column pressure drop, roughly 0.1 psi
    per stage

- id: R-11
  name: bottoms hot enough to risk thermal damage
  priority: 45
  when: "bottoms_T_at_column_P > 473.15"
  verdict: undetermined
  technologies: [distillation, vacuum_distillation]
  because: >-
    above about 200 C many organics decompose, polymerise or foul, and the
    bottoms is the hottest and longest-residence part of the column; whether
    this one does cannot be decided from boiling points alone
  cite: "Seader & Henley, Separation Process Principles, Ch.7"
  requires:
    - >-
      decomposition or polymerisation onset temperature of the bottoms
      component, which is not in the property database and must be supplied
      from literature or a supplier data sheet
  limitations: >-
    a false alarm is cheap and a missed one plugs a column, so this fires on
    temperature alone. If the component is thermally robust the rule is simply
    dismissed; if it is not, the usual answer is vacuum operation, which then
    conflicts with the preference for pressures at or above one atmosphere

- id: R-12
  name: the mixture splits into two liquid phases
  priority: 15
  when: "has_two_liquid_phases"
  verdict: caution
  technologies: [decanter, heterogeneous_azeotropic_distillation, distillation]
  because: >-
    a second liquid phase appears across part of the composition range, so the
    vapour-liquid model every number in this design was computed with does not
    describe the mixture there; the design may look entirely reasonable and
    still describe a separation that will not happen
  cite: "Seader & Henley, Separation Process Principles, Ch.11"
  requires:
    - >-
      a three-phase vapour-liquid-liquid flash, or a rigorous column model that
      carries two liquid phases, before any stage count or duty from this tool
      is used. The shortcut methods here assume a single liquid on every tray
    - >-
      whether the split is wanted or merely present. A miscibility gap is often
      the cheapest separation available -- a decanter does in one vessel what a
      column cannot do at all -- so this is a question about the flowsheet, not
      only about the column
  limitations: >-
    two of them, and both matter. First, the gap was located at the bubble
    temperature given by the ordinary vapour-liquid model, which is the model
    this rule is questioning; that temperature places the probe near where the
    column would operate but is not itself trustworthy once a split has been
    found. Second, and measured: the underlying activity-coefficient model
    predicts a false miscibility gap for water and glycerol, which are in fact
    miscible in all proportions, and that false positive is indistinguishable
    from a true one by gap width or composition difference. Aqueous polyols are
    a known weak point. Check the named pair against literature solubility data
    before acting on this, and treat it as caution rather than a finding
